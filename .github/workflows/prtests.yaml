---
name: PR Tests

on:
  pull_request:

permissions: {}

jobs:
  secret_scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan pull-request history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  tests:
    name: Unit and EventKit tests
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.4"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Run tests
        env:
          CI: "true"
          DEVICES: "iPhone 16"
        run: bundle exec fastlane ios ci_tests

      - name: Extract coverage summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(fastlane/test_output/*.xcresult)
          if (( ${#bundles[@]} > 0 )); then
            newest_bundle=$(ls -dt "${bundles[@]}" | head -n 1)
            xcrun xccov view --report --only-targets "$newest_bundle" > fastlane/test_output/coverage.txt
            echo "Coverage summary written to fastlane/test_output/coverage.txt"
          else
            echo "No .xcresult bundle found; skipping coverage summary"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-artifacts
          path: |
            fastlane/test_output/*.xml
            fastlane/test_output/*.json
            fastlane/test_output/*.xcresult
            fastlane/test_output/coverage.txt
          if-no-files-found: warn

      - name: Publish unit test results
        if: ${{ always() && github.event.pull_request.head.repo.fork == false }}
        uses: EnricoMi/publish-unit-test-result-action/macos@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        with:
          files: "fastlane/test_output/junit.xml"

  app_build:
    name: App Debug build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.4"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app without signing
        run: |
          xcodebuild \
            -project Kuna.xcodeproj \
            -scheme Kuna \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ci-app-debug/DerivedData \
            -clonedSourcePackagesDirPath .build/ci-app-debug/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            build

  widget_build:
    name: Widget Debug build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.4"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build widget without signing
        run: |
          xcodebuild \
            -project Kuna.xcodeproj \
            -scheme KunaWidgetExtension \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ci-widget-debug/DerivedData \
            -clonedSourcePackagesDirPath .build/ci-widget-debug/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            build
