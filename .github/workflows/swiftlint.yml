---
name: SwiftLint

on:
  pull_request:
    paths:
      - ".github/workflows/swiftlint.yml"
      - ".swiftlint.yml"
      - "**/*.swift"

permissions: {}

jobs:
  swiftlint:
    name: SwiftLint changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Lint changed Swift files
        uses: norio-nomura/action-swiftlint@9f4dcd7fd46b4e75d7935cf2f4df406d5cae3684 # 3.2.1
        with:
          args: --strict
        env:
          DIFF_BASE: ${{ github.base_ref }}

  codeql:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: CodeQL (Swift)
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "16.4"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: swift
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Build for CodeQL
        run: |
          set -e
          DERIVED="$RUNNER_TEMP/DerivedData"
          if [ -f "Kuna.xcworkspace/contents.xcworkspacedata" ]; then
            xcodebuild \
              -workspace "Kuna.xcworkspace" \
              -scheme "Kuna" \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_IDENTITY="" \
              -derivedDataPath "$DERIVED" \
              build
          else
            xcodebuild \
              -project "Kuna.xcodeproj" \
              -scheme "Kuna" \
              -sdk iphonesimulator \
              -destination 'platform=iOS Simulator,name=iPhone 16' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_IDENTITY="" \
              -derivedDataPath "$DERIVED" \
              build
          fi

      - name: Analyze CodeQL results
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: "/language:swift"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcode-build-logs
          path: ${{ runner.temp }}/DerivedData/Logs/Build
          if-no-files-found: warn
